name: Publicar modelos no GitHub Release

on:
  workflow_dispatch:
    inputs:
      include_3b:
        description: "Publicar também o 3B (somente pesquisa/não comercial)"
        type: boolean
        required: true
        default: true
      research_license_ack:
        description: "Para publicar o 3B, digite: SOMENTE PESQUISA"
        type: string
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: models-v1
      CHUNK_SIZE: 1900M
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar aceite da licença do 3B
        if: ${{ inputs.include_3b && inputs.research_license_ack != 'SOMENTE PESQUISA' }}
        run: |
          echo "O modelo 3B usa Qwen Research License. Execute novamente e digite SOMENTE PESQUISA no campo de aceite."
          exit 1

      - name: Criar ou atualizar release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG já existe; assets serão sobrescritos."
          else
            gh release create "$RELEASE_TAG" \
              --title "Modelos GGUF para Offgrid" \
              --notes "Modelos divididos em partes menores que 2 GB. A extensão remonta e valida o SHA-256 localmente. Consulte docs/MODEL_LICENSES.md antes do uso."
          fi

      - name: Baixar, validar e publicar Qwen 1.5B
        shell: bash
        run: |
          set -euo pipefail
          FILE="qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"
          URL="https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/${FILE}?download=true"
          EXPECTED="cc324af070c2ecbfd324a30884d2f951a7ff756aba85cb811a6ec436933bb046"
          mkdir -p work/1.5b
          curl --fail --location --retry 5 --retry-all-errors \
            --output "work/1.5b/$FILE" "$URL"
          ACTUAL="$(sha256sum "work/1.5b/$FILE" | awk '{print $1}')"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "SHA-256 inválido: $ACTUAL"; exit 1; }
          gh release upload "$RELEASE_TAG" "work/1.5b/$FILE" --clobber
          rm -rf work/1.5b

      - name: Baixar, validar e publicar Qwen 7B
        shell: bash
        run: |
          set -euo pipefail
          FILE="qwen2.5-coder-7b-instruct-q4_k_m.gguf"
          URL="https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/${FILE}?download=true"
          EXPECTED="509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c"
          mkdir -p work/parts
          mkfifo work/hash-stream
          sha256sum < work/hash-stream | awk '{print $1}' > work/digest &
          HASH_PID=$!
          curl --fail --location --retry 5 --retry-all-errors "$URL" \
            | tee work/hash-stream \
            | split -b "$CHUNK_SIZE" -d -a 2 - "work/parts/$FILE.part-"
          wait "$HASH_PID"
          ACTUAL="$(cat work/digest)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "SHA-256 inválido: $ACTUAL"; exit 1; }
          gh release upload "$RELEASE_TAG" work/parts/$FILE.part-* --clobber
          rm -rf work

      - name: Baixar, validar e publicar Qwen 3B
        if: ${{ inputs.include_3b }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="qwen2.5-coder-3b-instruct-q4_k_m.gguf"
          URL="https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/${FILE}?download=true"
          EXPECTED="724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7"
          mkdir -p work/parts
          mkfifo work/hash-stream
          sha256sum < work/hash-stream | awk '{print $1}' > work/digest &
          HASH_PID=$!
          curl --fail --location --retry 5 --retry-all-errors "$URL" \
            | tee work/hash-stream \
            | split -b "$CHUNK_SIZE" -d -a 2 - "work/parts/$FILE.part-"
          wait "$HASH_PID"
          ACTUAL="$(cat work/digest)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "SHA-256 inválido: $ACTUAL"; exit 1; }
          gh release upload "$RELEASE_TAG" work/parts/$FILE.part-* --clobber
          rm -rf work

      - name: Baixar e publicar binários llama-server
        shell: bash
        run: |
          set -euo pipefail
          # Descobre a versão mais recente do llama.cpp (usa o token do GitHub para evitar rate limit)
          LLAMA_VERSION=$(curl --silent --fail             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/ggerganov/llama.cpp/releases/latest             | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "Usando llama.cpp $LLAMA_VERSION"
          mkdir -p work/bins

          # Windows x64
          WIN_URL="https://github.com/ggerganov/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-win-avx2-x64.zip"
          echo "Baixando binário Windows..."
          curl --fail --location --retry 5 --retry-all-errors --output work/bins/win.zip "$WIN_URL"
          cd work/bins && unzip -j win.zip "llama-server.exe" -d . && cd ../..
          mv work/bins/llama-server.exe work/bins/llama-server-win-x64.exe
          WIN_SHA=$(sha256sum work/bins/llama-server-win-x64.exe | awk '{print $1}')
          echo "SHA-256 Windows: $WIN_SHA"

          # Linux x64
          LINUX_URL="https://github.com/ggerganov/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.zip"
          echo "Baixando binário Linux..."
          curl --fail --location --retry 5 --retry-all-errors --output work/bins/linux.zip "$LINUX_URL"
          cd work/bins && unzip -j linux.zip "llama-server" -d . && cd ../..
          mv work/bins/llama-server work/bins/llama-server-linux-x64
          chmod +x work/bins/llama-server-linux-x64
          LINUX_SHA=$(sha256sum work/bins/llama-server-linux-x64 | awk '{print $1}')
          echo "SHA-256 Linux: $LINUX_SHA"

          # macOS arm64 (Apple Silicon)
          MACOS_ARM_URL="https://github.com/ggerganov/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-macos-arm64.zip"
          echo "Baixando binário macOS arm64..."
          curl --fail --location --retry 5 --retry-all-errors --output work/bins/macos-arm.zip "$MACOS_ARM_URL"
          cd work/bins && unzip -j macos-arm.zip "llama-server" -d ./macos-arm && cd ../..
          mv work/bins/macos-arm/llama-server work/bins/llama-server-darwin-arm64
          chmod +x work/bins/llama-server-darwin-arm64
          MACOS_ARM_SHA=$(sha256sum work/bins/llama-server-darwin-arm64 | awk '{print $1}')
          echo "SHA-256 macOS arm64: $MACOS_ARM_SHA"

          # macOS x64 (Intel)
          MACOS_X64_URL="https://github.com/ggerganov/llama.cpp/releases/download/${LLAMA_VERSION}/llama-${LLAMA_VERSION}-bin-macos-x64.zip"
          echo "Baixando binário macOS x64..."
          curl --fail --location --retry 5 --retry-all-errors --output work/bins/macos-x64.zip "$MACOS_X64_URL"
          cd work/bins && unzip -j macos-x64.zip "llama-server" -d ./macos-x64 && cd ../..
          mv work/bins/macos-x64/llama-server work/bins/llama-server-darwin-x64
          chmod +x work/bins/llama-server-darwin-x64
          MACOS_X64_SHA=$(sha256sum work/bins/llama-server-darwin-x64 | awk '{print $1}')
          echo "SHA-256 macOS x64: $MACOS_X64_SHA"

          # Publica os binários no release
          gh release upload "$RELEASE_TAG"             work/bins/llama-server-win-x64.exe             work/bins/llama-server-linux-x64             work/bins/llama-server-darwin-arm64             work/bins/llama-server-darwin-x64             --clobber

          # Atualiza os SHA-256 no manifest.json via script externo
          python3 scripts/update-binary-sha.py "$WIN_SHA" "$LINUX_SHA" "$MACOS_ARM_SHA" "$MACOS_X64_SHA" 

          rm -rf work/bins

      - name: Baixar licenças oficiais e publicar manifesto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          curl --fail --location --retry 5 \
            --output release-metadata/QWEN-1.5B-APACHE-2.0.txt \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct/resolve/main/LICENSE"          curl --fail --location --retry 5 \
            --output release-metadata/QWEN-7B-APACHE-2.0.txt \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct/resolve/main/LICENSE"
          if [[ "${{ inputs.include_3b }}" == "true" ]]; then
            curl --fail --location --retry 5 \
              --output release-metadata/QWEN-3B-RESEARCH-LICENSE.txt \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct/resolve/main/LICENSE"
          fi
          cp models/manifest.json docs/MODEL_LICENSES.md release-metadata/
          gh release upload "$RELEASE_TAG" release-metadata/* --clobber