name: Publicar modelos no GitHub Release

on:
  workflow_dispatch:
    inputs:
      include_3b:
        description: "Publicar também o 3B (somente pesquisa/não comercial)"
        type: boolean
        required: true
        default: true
      research_license_ack:
        description: "Para publicar o 3B, digite: SOMENTE PESQUISA"
        type: string
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: models-v1
      CHUNK_SIZE: 1900M
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar aceite da licença do 3B
        if: ${{ inputs.include_3b && inputs.research_license_ack != 'SOMENTE PESQUISA' }}
        run: |
          echo "O modelo 3B usa Qwen Research License. Execute novamente e digite SOMENTE PESQUISA no campo de aceite."
          exit 1

      - name: Criar ou atualizar release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG já existe; assets serão sobrescritos."
          else
            gh release create "$RELEASE_TAG" \
              --title "Modelos GGUF para Offgrid" \
              --notes "Modelos divididos em partes menores que 2 GB. A extensão remonta e valida o SHA-256 localmente. Consulte docs/MODEL_LICENSES.md antes do uso."
          fi

      - name: Baixar, validar e publicar Qwen3 4B
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FILE="Qwen3-4B-Q4_K_M.gguf"
          FILE="qwen3-4b-q4_k_m.gguf"
          URL="https://huggingface.co/Qwen/Qwen3-4B-GGUF/resolve/main/${SOURCE_FILE}?download=true"
          EXPECTED="7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5"
          mkdir -p work/parts
          mkfifo work/hash-stream
          sha256sum < work/hash-stream | awk '{print $1}' > work/digest &
          HASH_PID=$!
          curl --fail --location --retry 5 --retry-all-errors "$URL" \
            | tee work/hash-stream \
            | split -b "$CHUNK_SIZE" -d -a 2 - "work/parts/$FILE.part-"
          wait "$HASH_PID"
          ACTUAL="$(cat work/digest)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "SHA-256 inválido: $ACTUAL"; exit 1; }
          gh release upload "$RELEASE_TAG" work/parts/$FILE.part-* --clobber
          rm -rf work

      - name: Baixar, validar e publicar Qwen 7B
        shell: bash
        run: |
          set -euo pipefail
          FILE="qwen2.5-coder-7b-instruct-q4_k_m.gguf"
          URL="https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/${FILE}?download=true"
          EXPECTED="509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c"
          mkdir -p work/parts
          mkfifo work/hash-stream
          sha256sum < work/hash-stream | awk '{print $1}' > work/digest &
          HASH_PID=$!
          curl --fail --location --retry 5 --retry-all-errors "$URL" \
            | tee work/hash-stream \
            | split -b "$CHUNK_SIZE" -d -a 2 - "work/parts/$FILE.part-"
          wait "$HASH_PID"
          ACTUAL="$(cat work/digest)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "SHA-256 inválido: $ACTUAL"; exit 1; }
          gh release upload "$RELEASE_TAG" work/parts/$FILE.part-* --clobber
          rm -rf work

      - name: Baixar, validar e publicar Qwen 3B
        if: ${{ inputs.include_3b }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="qwen2.5-coder-3b-instruct-q4_k_m.gguf"
          URL="https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct-GGUF/resolve/main/${FILE}?download=true"
          EXPECTED="724fb256bec1ff062b2f65e4569e871ad2e95ab2a3989723d1769c54294730b7"
          mkdir -p work/parts
          mkfifo work/hash-stream
          sha256sum < work/hash-stream | awk '{print $1}' > work/digest &
          HASH_PID=$!
          curl --fail --location --retry 5 --retry-all-errors "$URL" \
            | tee work/hash-stream \
            | split -b "$CHUNK_SIZE" -d -a 2 - "work/parts/$FILE.part-"
          wait "$HASH_PID"
          ACTUAL="$(cat work/digest)"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo "SHA-256 inválido: $ACTUAL"; exit 1; }
          gh release upload "$RELEASE_TAG" work/parts/$FILE.part-* --clobber
          rm -rf work

      - name: Baixar e publicar binários llama-server
        shell: bash
        run: |
          set -euo pipefail
          # Versão do llama.cpp — atualize em: https://github.com/ggml-org/llama.cpp/releases
          LLAMA_VERSION="b10218"
          BASE="https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_VERSION}"
          echo "Usando llama.cpp ${LLAMA_VERSION}"
          mkdir -p work/bins

          # Windows x64 (CPU) — extrai todos os arquivos (exe + DLLs) e reempacota como zip
          echo "Baixando binário Windows..."
          curl --fail --location --retry 5 --retry-all-errors \
            --output work/bins/win-src.zip \
            "${BASE}/llama-${LLAMA_VERSION}-bin-win-cpu-x64.zip"
          mkdir -p work/bins/llama-server-win-x64
          unzip -j work/bins/win-src.zip -d work/bins/llama-server-win-x64/
          cd work/bins && zip -r llama-server-win-x64.zip llama-server-win-x64/ && cd ../..
          WIN_SHA=$(sha256sum work/bins/llama-server-win-x64.zip | awk '{print $1}')
          echo "SHA-256 Windows zip: ${WIN_SHA}" 

          # Linux x64 (tar.gz)
          echo "Baixando binário Linux..."
          curl --fail --location --retry 5 --retry-all-errors \
            --output work/bins/linux.tar.gz \
            "${BASE}/llama-${LLAMA_VERSION}-bin-ubuntu-x64.tar.gz"
          mkdir -p work/bins/linux
          tar -xzf work/bins/linux.tar.gz -C work/bins/linux --wildcards "*/llama-server" || \
            tar -xzf work/bins/linux.tar.gz -C work/bins/linux "llama-server"
          find work/bins/linux -name "llama-server" -exec mv {} work/bins/llama-server-linux-x64 \;
          chmod +x work/bins/llama-server-linux-x64
          LINUX_SHA=$(sha256sum work/bins/llama-server-linux-x64 | awk '{print $1}')
          echo "SHA-256 Linux: ${LINUX_SHA}"

          # macOS arm64 (tar.gz)
          echo "Baixando binário macOS arm64..."
          curl --fail --location --retry 5 --retry-all-errors \
            --output work/bins/macos-arm.tar.gz \
            "${BASE}/llama-${LLAMA_VERSION}-bin-macos-arm64.tar.gz"
          mkdir -p work/bins/macos-arm
          tar -xzf work/bins/macos-arm.tar.gz -C work/bins/macos-arm --wildcards "*/llama-server" || \
            tar -xzf work/bins/macos-arm.tar.gz -C work/bins/macos-arm "llama-server"
          find work/bins/macos-arm -name "llama-server" -exec mv {} work/bins/llama-server-darwin-arm64 \;
          chmod +x work/bins/llama-server-darwin-arm64
          MACOS_ARM_SHA=$(sha256sum work/bins/llama-server-darwin-arm64 | awk '{print $1}')
          echo "SHA-256 macOS arm64: ${MACOS_ARM_SHA}"

          # macOS x64 (tar.gz)
          echo "Baixando binário macOS x64..."
          curl --fail --location --retry 5 --retry-all-errors \
            --output work/bins/macos-x64.tar.gz \
            "${BASE}/llama-${LLAMA_VERSION}-bin-macos-x64.tar.gz"
          mkdir -p work/bins/macos-x64
          tar -xzf work/bins/macos-x64.tar.gz -C work/bins/macos-x64 --wildcards "*/llama-server" || \
            tar -xzf work/bins/macos-x64.tar.gz -C work/bins/macos-x64 "llama-server"
          find work/bins/macos-x64 -name "llama-server" -exec mv {} work/bins/llama-server-darwin-x64 \;
          chmod +x work/bins/llama-server-darwin-x64
          MACOS_X64_SHA=$(sha256sum work/bins/llama-server-darwin-x64 | awk '{print $1}')
          echo "SHA-256 macOS x64: ${MACOS_X64_SHA}"

          # Publica no release
          gh release upload "$RELEASE_TAG" \
            work/bins/llama-server-win-x64.zip \
            work/bins/llama-server-linux-x64 \
            work/bins/llama-server-darwin-arm64 \
            work/bins/llama-server-darwin-x64 \
            --clobber

          # Atualiza SHA-256 no manifest.json
          python3 scripts/update-binary-sha.py \
            "${WIN_SHA}" "${LINUX_SHA}" "${MACOS_ARM_SHA}" "${MACOS_X64_SHA}"

          rm -rf work/bins


      - name: Baixar licenças oficiais e publicar manifesto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          curl --fail --location --retry 5 \
            --output release-metadata/QWEN3-4B-APACHE-2.0.txt \
            "https://huggingface.co/Qwen/Qwen3-4B/resolve/main/LICENSE"
          curl --fail --location --retry 5 \
            --output release-metadata/QWEN-7B-APACHE-2.0.txt \
            "https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct/resolve/main/LICENSE"
          if [[ "${{ inputs.include_3b }}" == "true" ]]; then
            curl --fail --location --retry 5 \
              --output release-metadata/QWEN-3B-RESEARCH-LICENSE.txt \
              "https://huggingface.co/Qwen/Qwen2.5-Coder-3B-Instruct/resolve/main/LICENSE"
          fi
          cp models/manifest.json docs/MODEL_LICENSES.md release-metadata/
          gh release upload "$RELEASE_TAG" release-metadata/* --clobber
