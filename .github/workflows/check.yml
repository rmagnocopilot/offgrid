name: Verificar Offgrid TypeScript
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        run: npm install
      - name: Verificar TypeScript
        run: npm run check
      - name: Testar
        run: npm test
      - name: Empacotar
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: offgrid-vsix
          path: '*.vsix'
